<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生後日数カウンター</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d252c;
      --muted: #687581;
      --line: #d9e0e6;
      --panel: #ffffff;
      --soft: #f3f7f5;
      --accent: #0c7c70;
      --accent-dark: #075c53;
      --warn: #aa5b00;
      --blue: #315f9b;
      --shadow: 0 18px 48px rgba(31, 48, 56, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(12, 124, 112, 0.16), transparent 30rem),
        radial-gradient(circle at 86% 18%, rgba(49, 95, 155, 0.14), transparent 26rem),
        linear-gradient(180deg, #f8fbfa 0%, #edf3f0 100%);
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    header {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 42rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .today-chip {
      justify-self: end;
      width: min(100%, 340px);
      border: 1px solid rgba(12, 124, 112, 0.24);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(31, 48, 56, 0.08);
    }

    .today-chip span {
      display: block;
      color: var(--muted);
      font-size: 0.84rem;
      margin-bottom: 6px;
    }

    .today-chip strong {
      font-size: 1.25rem;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(300px, 390px) 1fr;
      gap: 20px;
      align-items: start;
    }

    section {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .input-panel {
      padding: 22px;
    }

    .result-panel {
      overflow: hidden;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
      line-height: 1.4;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #bdc8d0;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(12, 124, 112, 0.16);
    }

    .field {
      margin-bottom: 18px;
    }

    .select-grid {
      display: grid;
      grid-template-columns: 1fr 0.76fr 0.76fr;
      gap: 10px;
    }

    .select-grid label {
      margin-bottom: 6px;
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .error {
      display: none;
      margin: 16px 0 0;
      border-left: 4px solid var(--warn);
      background: #fff6ea;
      color: #704000;
      padding: 11px 12px;
      border-radius: 6px;
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .error.is-visible {
      display: block;
    }

    .hero-result {
      min-height: 240px;
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      gap: 12px;
      padding: 34px;
      background:
        linear-gradient(135deg, rgba(12, 124, 112, 0.92), rgba(49, 95, 155, 0.88)),
        linear-gradient(45deg, #0c7c70, #315f9b);
      color: #fff;
    }

    .kicker {
      margin: 0;
      font-weight: 700;
      opacity: 0.88;
    }

    .day-number {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 0;
      line-height: 0.9;
    }

    .day-number strong {
      font-size: clamp(4rem, 12vw, 8.5rem);
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .day-number span {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
    }

    .sub-result {
      margin: 0;
      font-size: 1rem;
      line-height: 1.7;
      opacity: 0.92;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .metric {
      padding: 18px;
      border-right: 1px solid var(--line);
    }

    .metric:last-child {
      border-right: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      font-size: 1rem;
      line-height: 1.45;
    }

    .anniversary {
      padding: 24px 34px 30px;
      background: var(--panel);
    }

    .anniversary-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      border: 1px solid rgba(12, 124, 112, 0.24);
      border-radius: 8px;
      background: var(--soft);
      padding: 18px;
    }

    .anniversary-card h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .anniversary-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .countdown {
      min-width: 128px;
      text-align: center;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 14px 12px;
    }

    .countdown span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .countdown strong {
      font-size: 2rem;
      color: var(--accent-dark);
      font-variant-numeric: tabular-nums;
    }

    .examples {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.7;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 24px, 640px);
        padding-top: 24px;
      }

      header,
      .app-shell {
        grid-template-columns: 1fr;
      }

      .today-chip {
        justify-self: stretch;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .metric {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .metric:last-child {
        border-bottom: 0;
      }

      .anniversary-card {
        grid-template-columns: 1fr;
      }

      .countdown {
        text-align: left;
      }
    }

    @media (max-width: 460px) {
      main {
        width: min(100% - 18px, 420px);
      }

      .input-panel,
      .hero-result,
      .anniversary {
        padding: 18px;
      }

      .select-grid {
        grid-template-columns: 1fr;
      }

      .day-number strong {
        font-size: 3.6rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>生後日数カウンター</h1>
        <p class="lead">生年月日を選ぶと、今日で生まれてから何日目かと、次に来る1000日単位・4桁以上のゾロ目の記念日を表示します。</p>
      </div>
      <div class="today-chip" aria-live="polite">
        <span>今日の日付</span>
        <strong id="todayLabel">-</strong>
      </div>
    </header>

    <div class="app-shell">
      <section class="input-panel" aria-labelledby="inputTitle">
        <h2 id="inputTitle">生年月日</h2>

        <div class="field">
          <label for="birthDate">カレンダーから選択</label>
          <input id="birthDate" type="date">
          <p class="hint">カレンダー入力と下の選択式入力は自動で同期します。</p>
        </div>

        <div class="field">
          <label>選択式で入力</label>
          <div class="select-grid">
            <div>
              <label for="yearSelect">年</label>
              <select id="yearSelect"></select>
            </div>
            <div>
              <label for="monthSelect">月</label>
              <select id="monthSelect"></select>
            </div>
            <div>
              <label for="daySelect">日</label>
              <select id="daySelect"></select>
            </div>
          </div>
        </div>

        <div id="errorMessage" class="error" role="alert"></div>
      </section>

      <section class="result-panel" aria-labelledby="resultTitle">
        <div class="hero-result">
          <p class="kicker" id="resultTitle">今日で</p>
          <p class="day-number"><strong id="dayNumber">-</strong><span>日目</span></p>
          <p class="sub-result" id="summaryText">生年月日を選択してください。</p>
        </div>

        <div class="details" aria-label="日数の詳細">
          <div class="metric">
            <span>生年月日</span>
            <strong id="birthLabel" class="empty">-</strong>
          </div>
          <div class="metric">
            <span>経過日数</span>
            <strong id="elapsedLabel" class="empty">-</strong>
          </div>
          <div class="metric">
            <span>年齢の目安</span>
            <strong id="ageLabel" class="empty">-</strong>
          </div>
        </div>

        <div class="anniversary">
          <div class="anniversary-card">
            <div>
              <h3 id="nextTitle">次の記念日</h3>
              <p id="nextText">生年月日を選ぶと表示されます。</p>
              <div class="examples">記念日: 1000、2000、3000...日目 / 1111、2222、3333...日目</div>
            </div>
            <div class="countdown">
              <span>あと</span>
              <strong id="daysLeft">-</strong>
              <span>日</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const MS_PER_DAY = 24 * 60 * 60 * 1000;

    const els = {
      todayLabel: document.getElementById("todayLabel"),
      birthDate: document.getElementById("birthDate"),
      yearSelect: document.getElementById("yearSelect"),
      monthSelect: document.getElementById("monthSelect"),
      daySelect: document.getElementById("daySelect"),
      errorMessage: document.getElementById("errorMessage"),
      dayNumber: document.getElementById("dayNumber"),
      summaryText: document.getElementById("summaryText"),
      birthLabel: document.getElementById("birthLabel"),
      elapsedLabel: document.getElementById("elapsedLabel"),
      ageLabel: document.getElementById("ageLabel"),
      nextTitle: document.getElementById("nextTitle"),
      nextText: document.getElementById("nextText"),
      daysLeft: document.getElementById("daysLeft")
    };

    const today = startOfLocalDay(new Date());

    function startOfLocalDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function toDateValue(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(date);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("ja-JP").format(value);
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function parseDateValue(value) {
      if (!value) return null;
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }
      return date;
    }

    function diffDays(fromDate, toDate) {
      return Math.round((startOfLocalDay(toDate) - startOfLocalDay(fromDate)) / MS_PER_DAY);
    }

    function addDays(date, days) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
    }

    function isRepdigit(value) {
      const text = String(value);
      return text.length >= 4 && [...text].every((char) => char === text[0]);
    }

    function isAnniversaryDay(dayNumber) {
      return (dayNumber >= 1000 && dayNumber % 1000 === 0) || isRepdigit(dayNumber);
    }

    function findNextAnniversary(dayNumber) {
      let target = Math.max(1, dayNumber);
      while (!isAnniversaryDay(target)) {
        target += 1;
      }
      return target;
    }

    function anniversaryKind(dayNumber) {
      const kinds = [];
      if (dayNumber >= 1000 && dayNumber % 1000 === 0) kinds.push("1000の倍数");
      if (isRepdigit(dayNumber)) kinds.push("ゾロ目");
      return kinds.join("・");
    }

    function getAgeLabel(birthDate) {
      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();

      if (days < 0) {
        months -= 1;
        days += daysInMonth(today.getFullYear(), today.getMonth());
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const parts = [];
      if (years > 0) parts.push(`${years}歳`);
      if (months > 0 || years > 0) parts.push(`${months}か月`);
      parts.push(`${days}日`);
      return parts.join(" ");
    }

    function populateSelects() {
      const currentYear = today.getFullYear();
      const oldestYear = currentYear - 130;
      for (let year = currentYear; year >= oldestYear; year -= 1) {
        els.yearSelect.add(new Option(`${year}年`, String(year)));
      }
      for (let month = 1; month <= 12; month += 1) {
        els.monthSelect.add(new Option(`${month}月`, String(month)));
      }
      refreshDayOptions();
    }

    function refreshDayOptions(preferredDay = Number(els.daySelect.value) || today.getDate()) {
      const year = Number(els.yearSelect.value) || today.getFullYear();
      const month = Number(els.monthSelect.value) || today.getMonth() + 1;
      const maxDay = daysInMonth(year, month);
      const selectedDay = Math.min(preferredDay, maxDay);

      els.daySelect.innerHTML = "";
      for (let day = 1; day <= maxDay; day += 1) {
        els.daySelect.add(new Option(`${day}日`, String(day)));
      }
      els.daySelect.value = String(selectedDay);
    }

    function setSelectsFromDate(date) {
      els.yearSelect.value = String(date.getFullYear());
      els.monthSelect.value = String(date.getMonth() + 1);
      refreshDayOptions(date.getDate());
      els.daySelect.value = String(date.getDate());
    }

    function getDateFromSelects() {
      const year = Number(els.yearSelect.value);
      const month = Number(els.monthSelect.value);
      const day = Number(els.daySelect.value);
      return new Date(year, month - 1, day);
    }

    function showError(message) {
      els.errorMessage.textContent = message;
      els.errorMessage.classList.add("is-visible");
    }

    function clearError() {
      els.errorMessage.textContent = "";
      els.errorMessage.classList.remove("is-visible");
    }

    function updateResult(birthDate) {
      clearError();

      if (!birthDate) {
        resetResult();
        return;
      }

      const elapsed = diffDays(birthDate, today);
      if (elapsed < 0) {
        showError("未来の日付は選択できません。今日以前の生年月日を選んでください。");
        resetResult();
        return;
      }

      const dayNumber = elapsed + 1;
      const nextDayNumber = findNextAnniversary(dayNumber);
      const left = nextDayNumber - dayNumber;
      const nextDate = addDays(birthDate, nextDayNumber - 1);
      const kind = anniversaryKind(nextDayNumber);

      els.dayNumber.textContent = formatNumber(dayNumber);
      els.summaryText.textContent = `${formatDate(birthDate)}生まれの方は、今日で${formatNumber(dayNumber)}日目です。`;
      els.birthLabel.textContent = formatDate(birthDate);
      els.birthLabel.classList.remove("empty");
      els.elapsedLabel.textContent = `${formatNumber(elapsed)}日`;
      els.elapsedLabel.classList.remove("empty");
      els.ageLabel.textContent = getAgeLabel(birthDate);
      els.ageLabel.classList.remove("empty");

      if (left === 0) {
        els.nextTitle.textContent = "今日は記念日";
        els.nextText.textContent = `${formatNumber(nextDayNumber)}日目（${kind}）の記念日です。`;
      } else {
        els.nextTitle.textContent = "次の記念日";
        els.nextText.textContent = `${formatDate(nextDate)}に${formatNumber(nextDayNumber)}日目（${kind}）を迎えます。`;
      }
      els.daysLeft.textContent = formatNumber(left);
    }

    function resetResult() {
      els.dayNumber.textContent = "-";
      els.summaryText.textContent = "生年月日を選択してください。";
      els.birthLabel.textContent = "-";
      els.elapsedLabel.textContent = "-";
      els.ageLabel.textContent = "-";
      els.birthLabel.classList.add("empty");
      els.elapsedLabel.classList.add("empty");
      els.ageLabel.classList.add("empty");
      els.nextTitle.textContent = "次の記念日";
      els.nextText.textContent = "生年月日を選ぶと表示されます。";
      els.daysLeft.textContent = "-";
    }

    function syncFromDateInput() {
      const selected = parseDateValue(els.birthDate.value);
      if (selected) setSelectsFromDate(selected);
      updateResult(selected);
    }

    function syncFromSelects() {
      refreshDayOptions(Number(els.daySelect.value));
      const selected = getDateFromSelects();
      els.birthDate.value = toDateValue(selected);
      updateResult(selected);
    }

    els.todayLabel.textContent = formatDate(today);
    els.birthDate.max = toDateValue(today);

    populateSelects();
    setSelectsFromDate(today);
    els.birthDate.value = toDateValue(today);
    updateResult(today);

    els.birthDate.addEventListener("change", syncFromDateInput);
    els.yearSelect.addEventListener("change", syncFromSelects);
    els.monthSelect.addEventListener("change", syncFromSelects);
    els.daySelect.addEventListener("change", syncFromSelects);
  </script>
</body>
</html>
