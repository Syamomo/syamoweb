<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>名探偵コナン 8級クイズ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #5f6c7b;
      --paper: #fbfcff;
      --line: #d8e0ea;
      --red: #e63946;
      --blue: #1d70b8;
      --gold: #f4b942;
      --green: #2a9d8f;
      --shadow: 0 18px 50px rgba(20, 33, 61, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 18%, rgba(244, 185, 66, .28) 0 14%, transparent 15%),
        linear-gradient(135deg, #eef6ff 0%, #fff9e8 45%, #f7fbff 100%);
    }

    main {
      width: min(1040px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .hero {
      min-height: 210px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 22px;
      align-items: center;
      padding: 28px;
      border: 3px solid #111827;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -70px -100px auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 12deg, #111827 0 10deg, #fff 10deg 20deg);
      opacity: .08;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      margin: 14px 0 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.75;
    }

    .badge-art {
      justify-self: end;
      width: 190px;
      aspect-ratio: 1;
      border: 8px solid #111827;
      border-radius: 50%;
      background:
        linear-gradient(45deg, transparent 0 42%, #111827 42% 49%, transparent 49%),
        radial-gradient(circle at 50% 50%, #ffffff 0 36%, transparent 37%),
        conic-gradient(var(--red) 0 25%, var(--blue) 25% 50%, var(--gold) 50% 75%, var(--green) 75% 100%);
      display: grid;
      place-items: center;
      color: #111827;
      font-size: 3rem;
      font-weight: 900;
      box-shadow: inset 0 0 0 10px rgba(255,255,255,.72), 0 14px 30px rgba(0,0,0,.14);
      z-index: 1;
    }

    .panel {
      margin-top: 20px;
      padding: 22px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 12px 34px rgba(20, 33, 61, .08);
    }

    .tier-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .tier-button, .primary-button, .choice {
      min-height: 50px;
      border-radius: 8px;
      font-weight: 900;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .tier-button {
      border: 2px solid #111827;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 5px 0 #111827;
    }

    .tier-button:hover, .primary-button:hover, .choice:hover {
      transform: translateY(-2px);
    }

    .quiz-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-weight: 900;
    }

    .progress {
      height: 12px;
      margin-top: 16px;
      border-radius: 999px;
      background: #dbe7f3;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--gold));
      transition: width .18s ease;
    }

    .question {
      margin: 26px 0 18px;
      font-size: clamp(1.35rem, 2.5vw, 2.05rem);
      line-height: 1.45;
      font-weight: 900;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice {
      min-height: 76px;
      padding: 14px;
      text-align: left;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
    }

    .choice.correct {
      border-color: #167c63;
      background: #e8fff7;
    }

    .choice.wrong {
      border-color: #c62828;
      background: #ffecec;
    }

    .choice:disabled {
      cursor: default;
      transform: none;
    }

    .answer-row {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .feedback {
      margin: 0;
      font-weight: 900;
    }

    .primary-button {
      padding: 12px 18px;
      color: #fff;
      background: var(--red);
      box-shadow: 0 5px 0 #8f1e29;
    }

    .result {
      text-align: center;
      padding: 30px 16px;
    }

    .score {
      margin: 0;
      font-size: clamp(2.6rem, 9vw, 6rem);
      font-weight: 900;
      color: var(--blue);
    }

    .rank {
      margin: 8px 0 22px;
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      font-weight: 900;
    }

    .hidden { display: none !important; }

    @media (max-width: 760px) {
      main { width: min(100% - 18px, 1040px); padding-top: 10px; }
      .hero { grid-template-columns: 1fr; padding: 20px; }
      .badge-art { justify-self: start; width: 128px; font-size: 2.2rem; }
      .tier-grid, .choices { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <h1>名探偵コナン<br>8級クイズ</h1>
        <p class="lead">級・人物・映画を選んでスタート。各クイズ30問の中から10問がランダムで出ます。</p>
      </div>
      <div class="badge-art" aria-hidden="true">?</div>
    </section>

    <section id="selectPanel" class="panel">
      <div class="quiz-head">
        <h2>挑戦するクイズを選ぼう</h2>
        <span class="pill">全510問</span>
      </div>
      <div id="tierGrid" class="tier-grid"></div>
    </section>

    <section id="quizPanel" class="panel hidden" aria-live="polite">
      <div class="quiz-head">
        <span id="tierLabel" class="pill"></span>
        <span id="countLabel" class="pill"></span>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <p id="questionText" class="question"></p>
      <div id="choices" class="choices"></div>
      <div class="answer-row">
        <p id="feedback" class="feedback"></p>
        <button id="nextButton" class="primary-button hidden" type="button">次の問題へ</button>
      </div>
    </section>

    <section id="resultPanel" class="panel result hidden">
      <p id="scoreText" class="score"></p>
      <p id="rankText" class="rank"></p>
      <button id="retryButton" class="primary-button" type="button">級を選び直す</button>
    </section>
  </main>

    ]);

    const selectPanel = document.getElementById("selectPanel");
    const quizPanel = document.getElementById("quizPanel");
    const resultPanel = document.getElementById("resultPanel");
    const tierGrid = document.getElementById("tierGrid");
    const tierLabel = document.getElementById("tierLabel");
    const countLabel = document.getElementById("countLabel");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const choicesEl = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const retryButton = document.getElementById("retryButton");
    const scoreText = document.getElementById("scoreText");
    const rankText = document.getElementById("rankText");

    let currentTier = "";
    let currentSet = [];
    let index = 0;
    let score = 0;
    let locked = false;

    function q(text, choices, answer) {
      return { text, choices, answer };
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function pickTen(tier) {
      return shuffle(QUESTIONS[tier]).slice(0, 10);
    }

    function startTier(tier) {
      currentTier = tier;
      currentSet = pickTen(tier);
      index = 0;
      score = 0;
      selectPanel.classList.add("hidden");
      resultPanel.classList.add("hidden");
      quizPanel.classList.remove("hidden");
      tierLabel.textContent = tier;
      renderQuestion();
    }

    function renderQuestion() {
      locked = false;
      const item = currentSet[index];
      countLabel.textContent = `${index + 1} / 10`;
      progressBar.style.width = `${index * 10}%`;
      questionText.textContent = item.text;
      feedback.textContent = "";
      nextButton.classList.add("hidden");
      choicesEl.innerHTML = "";

      const mixed = shuffle(item.choices.map((label, originalIndex) => ({ label, originalIndex })));
      mixed.forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = choice.label;
        button.addEventListener("click", () => choose(button, choice.originalIndex));
        choicesEl.appendChild(button);
      });
    }

    function choose(button, originalIndex) {
      if (locked) return;
      locked = true;
      const item = currentSet[index];
      const isCorrect = originalIndex === item.answer;
      if (isCorrect) score += 1;

      [...choicesEl.children].forEach(choiceButton => {
        choiceButton.disabled = true;
        if (choiceButton.textContent === item.choices[item.answer]) {
          choiceButton.classList.add("correct");
        }
      });
      if (!isCorrect) button.classList.add("wrong");

      feedback.textContent = isCorrect ? "正解！" : `ざんねん。正解は「${item.choices[item.answer]}」`;
      nextButton.textContent = index === 9 ? "結果を見る" : "次の問題へ";
      nextButton.classList.remove("hidden");
      progressBar.style.width = `${(index + 1) * 10}%`;
    }

    function showResult() {
      quizPanel.classList.add("hidden");
      resultPanel.classList.remove("hidden");
      scoreText.textContent = `${score} / 10`;
      rankText.textContent = resultLabel(score);
    }

    function resultLabel(value) {
      if (value <= 6) return "頑張ろう";
      if (value === 7) return "もうちょっと";
      if (value === 8) return "合格";
      if (value === 9) return "Excellent";
      return "Perfect!!";
    }

    TIERS.forEach(tier => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tier-button";
      button.textContent = tier;
      button.addEventListener("click", () => startTier(tier));
      tierGrid.appendChild(button);
    });

    nextButton.addEventListener("click", () => {
      index += 1;
      if (index >= 10) {
        showResult();
      } else {
        renderQuestion();
      }
    });

    retryButton.addEventListener("click", () => {
      resultPanel.classList.add("hidden");
      selectPanel.classList.remove("hidden");
    });

    window.__CONAN_QUIZ_DATA__ = { TIERS, QUESTIONS, resultLabel };
  </script>
