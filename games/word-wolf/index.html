<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ワードウルフ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #65727f;
      --line: #d8e0e8;
      --paper: #fbfcf7;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --warm: #c7502d;
      --soft: #eef7f4;
      --shadow: 0 18px 40px rgba(23, 32, 42, .13);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, .08), transparent 34%),
        linear-gradient(315deg, rgba(199, 80, 45, .10), transparent 30%),
        var(--paper);
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 8px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 9vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    h2 {
      font-size: 22px;
      line-height: 1.25;
    }

    .status {
      min-width: 84px;
      text-align: right;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .screen {
      display: none;
      flex: 1;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: rgba(255, 255, 255, .88);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .16);
    }

    .name-grid {
      display: grid;
      gap: 8px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #e7ecef;
      color: var(--ink);
    }

    button.danger {
      background: var(--warm);
    }

    button.ghost {
      background: transparent;
      color: var(--accent-dark);
      border: 1px solid var(--line);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .52;
      transform: none;
    }

    .hint {
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .error {
      min-height: 20px;
      color: var(--warm);
      font-weight: 700;
      font-size: 14px;
    }

    .pass-card {
      min-height: 58vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .player-name {
      font-size: clamp(30px, 11vw, 52px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .secret {
      display: none;
      gap: 14px;
    }

    .secret.visible {
      display: grid;
    }

    .role {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 36px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 999px;
      padding: 8px 14px;
      color: #fff;
      background: var(--accent);
      font-weight: 900;
    }

    .role.wolf {
      background: var(--warm);
    }

    .word {
      padding: 22px 14px;
      border-radius: 8px;
      background: var(--soft);
      border: 1px solid #cce4de;
      font-size: clamp(34px, 12vw, 58px);
      font-weight: 900;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .timer {
      display: grid;
      place-items: center;
      min-height: 170px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: clamp(58px, 20vw, 92px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .vote-list {
      display: grid;
      gap: 8px;
    }

    .vote-option {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vote-option.selected {
      border-color: var(--accent);
      background: var(--soft);
      color: var(--accent-dark);
    }

    .result-grid {
      display: grid;
      gap: 8px;
    }

    .result-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .badge {
      border-radius: 999px;
      padding: 6px 10px;
      color: #fff;
      background: var(--accent);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.wolf {
      background: var(--warm);
    }

    .topic-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .topic {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      text-align: center;
    }

    .topic strong {
      display: block;
      margin-top: 5px;
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 380px) {
      .button-row,
      .topic-pair {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>ワードウルフ</h1>
      <div class="status" id="statusText">準備中</div>
    </header>

    <section class="screen active" id="setupScreen" aria-labelledby="setupTitle">
      <div class="panel stack">
        <h2 id="setupTitle">参加者を入力</h2>
        <label>
          プレイ人数
          <select id="playerCount"></select>
        </label>
        <div class="name-grid" id="nameFields"></div>
        <label>
          会話時間
          <select id="talkMinutes">
            <option value="3">3分</option>
            <option value="4">4分</option>
            <option value="5" selected>5分</option>
            <option value="7">7分</option>
            <option value="10">10分</option>
          </select>
        </label>
        <p class="error" id="setupError" role="alert"></p>
        <button id="startGame">ゲーム開始</button>
      </div>
    </section>

    <section class="screen" id="passScreen" aria-labelledby="passTitle">
      <div class="panel pass-card">
        <div class="stack">
          <p class="hint" id="passHint">次の人にスマホを渡してください</p>
          <h2 class="player-name" id="passTitle"></h2>
        </div>

        <div class="secret" id="secretBox">
          <div class="role" id="roleLabel"></div>
          <div class="word" id="secretWord"></div>
          <p class="hint">覚えたら隠して次の人へ回してください。</p>
        </div>

        <div class="stack">
          <button id="showSecret">お題を見る</button>
          <button class="secondary" id="nextPlayer" disabled>隠して次へ</button>
        </div>
      </div>
    </section>

    <section class="screen" id="talkScreen" aria-labelledby="talkTitle">
      <div class="panel stack">
        <h2 id="talkTitle">会話スタート</h2>
        <p class="hint">自分のお題を直接言わずに話し合い、1人だけ違うお題の人を探してください。</p>
        <div class="timer" id="timerText">05:00</div>
        <div class="button-row">
          <button id="timerToggle">開始</button>
          <button class="secondary" id="timerReset">リセット</button>
        </div>
        <button class="danger" id="goVote">投票へ</button>
      </div>
    </section>

    <section class="screen" id="voteScreen" aria-labelledby="voteTitle">
      <div class="panel stack">
        <h2 id="voteTitle">人狼だと思う人を選ぶ</h2>
        <div class="vote-list" id="voteList"></div>
        <button id="showResult" disabled>答え合わせ</button>
      </div>
    </section>

    <section class="screen" id="resultScreen" aria-labelledby="resultTitle">
      <div class="panel stack">
        <h2 id="resultTitle">結果</h2>
        <div class="topic-pair">
          <div class="topic">市民のお題<strong id="citizenTopic"></strong></div>
          <div class="topic">人狼のお題<strong id="wolfTopic"></strong></div>
        </div>
        <div class="result-grid" id="resultList"></div>
        <p class="hint" id="judgeText"></p>
        <div class="button-row">
          <button id="playAgain">同じメンバー</button>
          <button class="secondary" id="newSetup">最初から</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const topics = [
      ["カレー", "シチュー"],
      ["海", "プール"],
      ["犬", "猫"],
      ["映画館", "カラオケ"],
      ["夏祭り", "花火大会"],
      ["ラーメン", "うどん"],
      ["コンビニ", "スーパー"],
      ["飛行機", "新幹線"],
      ["温泉", "サウナ"],
      ["チョコレート", "クッキー"],
      ["野球", "サッカー"],
      ["学校", "会社"],
      ["朝ごはん", "夜食"],
      ["スマホ", "パソコン"],
      ["雨", "雪"],
      ["遊園地", "動物園"],
      ["コーヒー", "紅茶"],
      ["寿司", "刺身"],
      ["山登り", "キャンプ"],
      ["漫画", "小説"]
    ];

    const state = {
      players: [],
      assignments: [],
      revealIndex: 0,
      wolfIndex: -1,
      selectedVote: -1,
      citizenWord: "",
      wolfWord: "",
      timerSeconds: 300,
      timerInitial: 300,
      timerId: null
    };

    const screens = {
      setup: document.querySelector("#setupScreen"),
      pass: document.querySelector("#passScreen"),
      talk: document.querySelector("#talkScreen"),
      vote: document.querySelector("#voteScreen"),
      result: document.querySelector("#resultScreen")
    };

    const playerCount = document.querySelector("#playerCount");
    const nameFields = document.querySelector("#nameFields");
    const setupError = document.querySelector("#setupError");
    const statusText = document.querySelector("#statusText");
    const passTitle = document.querySelector("#passTitle");
    const passHint = document.querySelector("#passHint");
    const secretBox = document.querySelector("#secretBox");
    const roleLabel = document.querySelector("#roleLabel");
    const secretWord = document.querySelector("#secretWord");
    const showSecret = document.querySelector("#showSecret");
    const nextPlayer = document.querySelector("#nextPlayer");
    const timerText = document.querySelector("#timerText");
    const timerToggle = document.querySelector("#timerToggle");
    const voteList = document.querySelector("#voteList");
    const showResult = document.querySelector("#showResult");
    const resultList = document.querySelector("#resultList");
    const citizenTopic = document.querySelector("#citizenTopic");
    const wolfTopic = document.querySelector("#wolfTopic");
    const judgeText = document.querySelector("#judgeText");

    function shuffle(list) {
      return [...list].sort(() => Math.random() - 0.5);
    }

    function showScreen(name) {
      Object.entries(screens).forEach(([key, element]) => {
        element.classList.toggle("active", key === name);
      });
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function renderNameFields() {
      const count = Number(playerCount.value);
      const existing = [...nameFields.querySelectorAll("input")].map((input) => input.value);
      nameFields.innerHTML = "";
      for (let i = 0; i < count; i += 1) {
        const label = document.createElement("label");
        label.textContent = `${i + 1}人目`;
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 16;
        input.autocomplete = "off";
        input.placeholder = `プレイヤー${i + 1}`;
        input.value = existing[i] || "";
        label.append(input);
        nameFields.append(label);
      }
    }

    function setupCounts() {
      for (let i = 3; i <= 12; i += 1) {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = `${i}人`;
        if (i === 5) option.selected = true;
        playerCount.append(option);
      }
      renderNameFields();
    }

    function collectPlayers() {
      return [...nameFields.querySelectorAll("input")].map((input, index) => {
        const value = input.value.trim();
        return value || `プレイヤー${index + 1}`;
      });
    }

    function hasDuplicateNames(names) {
      return new Set(names).size !== names.length;
    }

    function startRound(keepPlayers = false) {
      const names = keepPlayers ? state.players : collectPlayers();
      setupError.textContent = "";

      if (names.length < 3) {
        setupError.textContent = "3人以上で遊べます。";
        return;
      }

      if (hasDuplicateNames(names)) {
        setupError.textContent = "同じ名前があるので、見分けられる名前にしてください。";
        return;
      }

      const pair = topics[Math.floor(Math.random() * topics.length)];
      const reversed = Math.random() > 0.5;
      state.players = names;
      state.citizenWord = reversed ? pair[1] : pair[0];
      state.wolfWord = reversed ? pair[0] : pair[1];
      state.wolfIndex = Math.floor(Math.random() * names.length);
      state.revealIndex = 0;
      state.selectedVote = -1;
      state.assignments = names.map((name, index) => ({
        name,
        role: index === state.wolfIndex ? "人狼" : "市民",
        word: index === state.wolfIndex ? state.wolfWord : state.citizenWord
      }));
      const minutes = Number(document.querySelector("#talkMinutes").value);
      state.timerInitial = minutes * 60;
      state.timerSeconds = state.timerInitial;
      stopTimer();
      renderPass();
      showScreen("pass");
    }

    function renderPass() {
      const player = state.assignments[state.revealIndex];
      passTitle.textContent = player.name;
      passHint.textContent = `${state.revealIndex + 1} / ${state.players.length}`;
      secretBox.classList.remove("visible");
      roleLabel.textContent = "";
      roleLabel.className = "role";
      secretWord.textContent = "";
      showSecret.disabled = false;
      nextPlayer.disabled = true;
      nextPlayer.textContent = state.revealIndex === state.players.length - 1 ? "会話へ" : "隠して次へ";
      setStatus("お題確認");
    }

    function revealSecret() {
      const player = state.assignments[state.revealIndex];
      roleLabel.textContent = player.role;
      roleLabel.classList.toggle("wolf", player.role === "人狼");
      secretWord.textContent = player.word;
      secretBox.classList.add("visible");
      showSecret.disabled = true;
      nextPlayer.disabled = false;
    }

    function goNextPlayer() {
      if (state.revealIndex < state.players.length - 1) {
        state.revealIndex += 1;
        renderPass();
        return;
      }
      renderTimer();
      setStatus("会話中");
      showScreen("talk");
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      return `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    function renderTimer() {
      timerText.textContent = formatTime(state.timerSeconds);
      timerToggle.textContent = state.timerId ? "一時停止" : "開始";
    }

    function startTimer() {
      if (state.timerId) return;
      state.timerId = window.setInterval(() => {
        state.timerSeconds = Math.max(0, state.timerSeconds - 1);
        renderTimer();
        if (state.timerSeconds === 0) stopTimer();
      }, 1000);
      renderTimer();
    }

    function stopTimer() {
      if (state.timerId) {
        window.clearInterval(state.timerId);
        state.timerId = null;
      }
      renderTimer();
    }

    function renderVote() {
      voteList.innerHTML = "";
      state.selectedVote = -1;
      showResult.disabled = true;
      state.players.forEach((name, index) => {
        const button = document.createElement("button");
        button.className = "vote-option";
        button.type = "button";
        button.innerHTML = `<span>${name}</span><span>選ぶ</span>`;
        button.addEventListener("click", () => {
          state.selectedVote = index;
          [...voteList.children].forEach((child, childIndex) => {
            child.classList.toggle("selected", childIndex === index);
            child.lastElementChild.textContent = childIndex === index ? "投票先" : "選ぶ";
          });
          showResult.disabled = false;
        });
        voteList.append(button);
      });
      setStatus("投票");
      showScreen("vote");
    }

    function renderResult() {
      citizenTopic.textContent = state.citizenWord;
      wolfTopic.textContent = state.wolfWord;
      resultList.innerHTML = "";
      state.assignments.forEach((player, index) => {
        const row = document.createElement("div");
        const isWolf = index === state.wolfIndex;
        row.className = "result-row";
        row.innerHTML = `<span>${player.name}<br><strong>${player.word}</strong></span><span class="badge ${isWolf ? "wolf" : ""}">${player.role}</span>`;
        resultList.append(row);
      });
      const votedName = state.players[state.selectedVote];
      const wolfName = state.players[state.wolfIndex];
      judgeText.textContent = state.selectedVote === state.wolfIndex
        ? `${votedName}さんが人狼でした。市民チームの勝ちです。`
        : `投票先は${votedName}さん。人狼は${wolfName}さんでした。人狼チームの勝ちです。`;
      setStatus("結果");
      showScreen("result");
    }

    playerCount.addEventListener("change", renderNameFields);
    document.querySelector("#startGame").addEventListener("click", () => startRound(false));
    showSecret.addEventListener("click", revealSecret);
    nextPlayer.addEventListener("click", goNextPlayer);
    timerToggle.addEventListener("click", () => state.timerId ? stopTimer() : startTimer());
    document.querySelector("#timerReset").addEventListener("click", () => {
      stopTimer();
      state.timerSeconds = state.timerInitial;
      renderTimer();
    });
    document.querySelector("#goVote").addEventListener("click", () => {
      stopTimer();
      renderVote();
    });
    showResult.addEventListener("click", renderResult);
    document.querySelector("#playAgain").addEventListener("click", () => startRound(true));
    document.querySelector("#newSetup").addEventListener("click", () => {
      stopTimer();
      setStatus("準備中");
      showScreen("setup");
    });

    setupCounts();
    renderTimer();
  </script>
</body>
</html>
